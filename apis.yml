aid: strand-therapeutics
name: Strand Therapeutics
description: >-
  Strand Therapeutics is a clinical-stage biotechnology company headquartered in Boston, Massachusetts,
  founded by biological engineers out of MIT — including Jacob Becraft (CEO), Tasuku Kitada (President,
  Head of R&D), Ron Weiss and Darrell J. Irvine — around what the company describes as the first mRNA
  programming language. Strand engineers programmable genetic medicines across three named platforms:
  SignalPath LNPs for tissue-selective delivery of mRNA payloads, SignalLock RNA which restricts
  expression to target tissues and deactivates it elsewhere, and SignalScript RNA for self-replicating
  and circular RNA constructs. Its clinical pipeline includes STX-001, STX-003 (systemic tumor delivery,
  entering the clinic in 2026) and STX-005 (in vivo CAR T), targeting solid tumors, blood cancers and
  autoimmune disease. Strand operates no developer program and publishes no API, SDK, webhook or
  machine-readable specification of any kind; its corporate site is a static Webflow property behind
  Cloudflare with no content API, no feed and no sitemap. It is catalogued here because it appears in
  the API Evangelist secondary-market harvest backlog, and this profile records the honest zero.
